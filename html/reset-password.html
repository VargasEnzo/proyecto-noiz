<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noiz</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A4AFF">
  <link rel="apple-touch-icon" href="/IMAGENES/logo-noiz.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noiz">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/estiloslogin.css" />

</head>

<body>
  <div class="fondo"></div>
  <div class="login-wrapper">
  <div class="login-image">
  </div>
  <div class="formulario">
    <h2>Nueva contraseña</h2>

    <form id="reset-form">
      <input type="password" id="reset-password" placeholder="Nueva contraseña" required>
      <input type="password" id="reset-repetir" placeholder="Repetir contraseña" required>
      <p class="form-error" id="reset-error"></p>
      <button type="submit">Guardar contraseña</button>
    </form>

    <p class="toggle-text"><a href="login.html">Volver a iniciar sesión</a></p>
  </div>
</div>

<script src="../js/pwa.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
