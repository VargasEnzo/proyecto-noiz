<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noiz</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A4AFF">
  <link rel="icon" href="/IMAGENES/logo-noiz-app-icon.png">
  <link rel="apple-touch-icon" href="/IMAGENES/logo-noiz-app-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noiz">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/estiloslogin.css" />
  
</head>

<body>
  <!-- FONDO -->
  <div class="fondo"></div>
  <!-- CAJA -->
  <div class="login-wrapper">
  <div class="login-image">
  </div>
  <div class="formulario">
    <div class="formulario-logo">
      <img src="../IMAGENES/logo-noiz-icon.png" alt="" class="formulario-logo-icon">
      <span>Noiz</span>
    </div>
    <h2 id="form-title">Iniciar sesión</h2>

    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Contraseña" required>
      <p class="form-error" id="login-error"></p>
      <p class="form-success hidden" id="login-success"></p>
      <p class="toggle-text hidden" id="resend-verification-wrap"><a href="#" id="resend-verification-link">Reenviar mail de verificación</a></p>
      <button type="submit">Iniciar sesión</button>
      <p class="toggle-text"><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
    </form>

    <form id="register-form" class="hidden">
      <input type="text" id="register-nombre" placeholder="Nombre" required>
      <input type="text" id="register-apellido" placeholder="Apellido" required>
      <input type="email" id="register-email" placeholder="Email" required>
      <input type="password" id="register-password" placeholder="Contraseña" required>
      <input type="password" id="register-repetir" placeholder="Repetir contraseña" required>
      <p class="form-error" id="register-error"></p>
      <p class="form-success hidden" id="register-success"></p>
      <button type="submit">Crear cuenta</button>
    </form>

    <p class="toggle-text">
      <span id="toggle-to-register">¿No tenés cuenta? <a href="#">Registrate</a></span>
      <span id="toggle-to-login" class="hidden">¿Ya tenés cuenta? <a href="#">Iniciá sesión</a></span>
    </p>
  </div>
</div>

<script src="../js/pwa.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
