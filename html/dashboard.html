<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A4AFF">
  <link rel="apple-touch-icon" href="/IMAGENES/logo-noiz.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noiz">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/estilosdashboard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>



<body>

  <header>
    <div class="fondo"></div>

    <input type="checkbox" id="mobile-menu-toggle" class="mobile-menu-toggle">

    <div class="mobile-topbar">
      <div class="mobile-topbar-logo">
        <img src="../IMAGENES/logo-noiz.png" alt="" class="sidebar-logo-icon">
        Noiz
      </div>
      <label for="mobile-menu-toggle" class="hamburger-btn" title="Menú">
        <i class="bi bi-list"></i>
      </label>
    </div>

    <label for="mobile-menu-toggle" class="mobile-backdrop"></label>

    <div class="menu_side">
      <label for="mobile-menu-toggle" class="drawer-close-btn" title="Cerrar menú">
        <i class="bi bi-x-lg"></i>
      </label>
      <div class="sidebar-logo">
        <img src="../IMAGENES/logo-noiz.png" alt="" class="sidebar-logo-icon">
        Noiz
      </div>

      <div class="sidebar-search">
        <i class="bi bi-search"></i>
        <input type="text" id="search-input" placeholder="Buscar canciones o artistas...">
      </div>

      <nav class="playlist">
        <h4 class="active" id="nav-home"><i class="bi bi-house-door-fill"></i>Inicio</h4>
        <h4 id="nav-explorar"><i class="bi bi-search"></i>Explorar</h4>
        <h4><i class="bi bi-music-note-list"></i>Géneros</h4>
        <h4><i class="bi bi-broadcast"></i>Radio</h4>
        <h4><i class="bi bi-people-fill"></i>Artistas</h4>
        <h4><i class="bi bi-folder-fill"></i>Albums</h4>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section-header">
          <span>Mis playlists</span>
          <i class="bi bi-plus-lg" id="new-playlist-btn" title="Nueva playlist"></i>
        </div>
        <div class="playlist-list" id="playlist-list"></div>
      </nav>

      <div class="sidebar-profile">
        <div class="sidebar-profile-clickable" id="open-profile-btn">
          <i class="bi bi-person-circle" id="sidebar-avatar-icon"></i>
          <img src="" id="sidebar-avatar-img" class="hidden" alt="">
          <span id="greeting">Mi cuenta</span>
        </div>
        <i class="bi bi-box-arrow-right" id="logout-btn" title="Cerrar sesión"></i>
      </div>
    </div>

    <div class="song_side">
      <div class="now-playing-hero" id="now-playing-hero">
        <img src="" id="hero-cover" alt="">
        <div class="now-playing-hero-overlay">
          <span class="hero-eyebrow">Sonando ahora</span>
          <h2 id="hero-title"></h2>
          <p id="hero-artist"></p>
        </div>
      </div>

      <h3 class="song_side_title" id="song-side-title">Inicio</h3>
      <ul class="song-list" id="song-list"></ul>
    </div>

    <div class="discover_side">
      <h3 class="discover_title">Recomendado</h3>
      <div id="recommended-card"></div>

      <h3 class="discover_title">Top Artistas</h3>
      <div id="top-artists-list"></div>
    </div>

    <div class="master_play">
      <div class="now-playing">
        <img src="" id="mp-cover" alt="">
        <div class="now-playing-info">
          <h4 id="mp-title"></h4>
          <p id="mp-artist"></p>
        </div>
      </div>
      <div class="mp-controls-wrap">
        <div class="mp-controls">
          <i class="bi bi-shuffle" id="mp-shuffle" title="Aleatorio"></i>
          <i class="bi bi-skip-start-fill" id="mp-prev" title="Anterior"></i>
          <i class="bi bi-play-fill mp-play-button" id="mp-play" title="Play"></i>
          <i class="bi bi-skip-end-fill" id="mp-next" title="Siguiente"></i>
        </div>
        <div class="mp-progress-wrap">
          <span id="mp-current-time">0:00</span>
          <div class="mp-progress-bar" id="mp-progress-bar">
            <div class="mp-progress" id="mp-progress"></div>
          </div>
          <span id="mp-duration">0:00</span>
        </div>
      </div>
      <div class="mp-volume-wrap">
        <i class="bi bi-volume-up-fill" id="mp-volume-icon" title="Silenciar"></i>
        <input type="range" id="mp-volume-slider" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </header>

  <script src="../js/pwa.js"></script>
  <script src="../js/dashboard.js"></script>
</body>




</html>
