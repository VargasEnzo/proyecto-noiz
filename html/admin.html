<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración - Noiz</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A4AFF">
  <link rel="icon" href="/IMAGENES/logo-noiz-app-icon.png">
  <link rel="apple-touch-icon" href="/IMAGENES/logo-noiz-app-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/estilosadmin.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="fondo"></div>

  <div class="admin-wrapper">
    <div class="admin-topbar">
      <div class="admin-logo">
        <img src="../IMAGENES/logo-noiz-icon.png" alt="" class="admin-logo-icon">
        Noiz <span>Admin</span>
      </div>
      <a href="dashboard.html" class="admin-back-link"><i class="bi bi-arrow-left"></i> Volver al dashboard</a>
    </div>

    <div class="admin-stats">
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="stat-usuarios">0</span>
        <span class="admin-stat-label">Usuarios</span>
      </div>
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="stat-playlists">0</span>
        <span class="admin-stat-label">Playlists creadas</span>
      </div>
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="stat-youtube-quota">0 / 0</span>
        <span class="admin-stat-label">Cuota de YouTube usada hoy</span>
        <span class="admin-stat-note">Estimado propio a partir de las llamadas que hace el server, no es un dato oficial de Google.</span>
      </div>
    </div>

    <div class="admin-panel">
      <h3>Usuarios</h3>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Email</th>
              <th>Plan</th>
              <th>Alta</th>
              <th>Playlists</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="admin-users-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/pwa.js"></script>
  <script src="../js/admin.js"></script>
</body>

</html>
